spring.application.name=PlaylistManager
server.port=8080

# --- MySQL datasource (change username/password to match your local MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/playlistmanager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" creates/updates the songs table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
